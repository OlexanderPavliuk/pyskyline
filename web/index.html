<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Python codebase rendered as a 3D city." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='7' width='4' height='8' fill='%23b4b4ba'/><rect x='6' y='2' width='4' height='13' fill='%23ff5a36'/><rect x='11' y='5' width='4' height='10' fill='%23b4b4ba'/></svg>" />
    <title>pyskyline</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="bg-ink text-fog antialiased">
    <div id="stage" class="fixed inset-0"></div>

    <header class="panel pointer-events-auto fixed top-4 left-4 w-[min(22rem,calc(100vw-2rem))] p-4">
      <div class="flex items-baseline justify-between gap-3">
        <h1 class="text-base font-semibold tracking-tight text-white">pyskyline</h1>
        <a
          class="text-xs text-mute hover:text-white"
          href="https://github.com/OlexanderPavliuk/pyskyline"
          target="_blank"
          rel="noreferrer"
          >source</a
        >
      </div>
      <p id="city-summary" class="mt-1 text-xs text-mute">Loading…</p>

      <label class="mt-4 block text-[11px] tracking-wider text-mute uppercase" for="city-select">City</label>
      <div class="mt-1 flex gap-2">
        <select id="city-select" class="control min-w-0 flex-1"></select>
        <label class="control cursor-pointer whitespace-nowrap" title="Open a city.json made by the CLI">
          Open file
          <input id="file-input" type="file" accept=".json,application/json" class="hidden" />
        </label>
      </div>

      <p class="mt-4 text-[11px] tracking-wider text-mute uppercase">Color</p>
      <div id="color-modes" class="mt-1 grid grid-cols-3 gap-1" role="radiogroup"></div>

      <label class="mt-4 block text-[11px] tracking-wider text-mute uppercase" for="search">Find a file</label>
      <input
        id="search"
        class="control mt-1 w-full font-mono"
        list="file-paths"
        placeholder="path/to/module.py"
        autocomplete="off"
        spellcheck="false"
      />
      <datalist id="file-paths"></datalist>
    </header>

    <aside
      id="panel"
      class="panel fixed right-4 bottom-4 left-4 hidden max-h-[45vh] overflow-y-auto p-4 md:top-4 md:left-auto md:max-h-none md:w-[22rem]"
      aria-label="File details"
    ></aside>

    <div
      id="tooltip"
      class="panel pointer-events-none fixed top-0 left-0 hidden max-w-xs px-2.5 py-1.5 font-mono text-xs"
    ></div>

    <footer id="legend" class="panel pointer-events-auto fixed bottom-4 left-4 w-[min(22rem,calc(100vw-2rem))] p-4 text-xs">
      <div id="legend-bar" class="h-1.5 w-full rounded-full"></div>
      <div class="mt-1 flex justify-between text-mute"><span>low</span><span>high</span></div>
      <p id="legend-text" class="mt-2 text-fog"></p>
      <p class="mt-1 text-mute">Footprint: lines of code. Height: total complexity.</p>
      <p class="mt-1 text-mute max-md:hidden">Drag to orbit, scroll to zoom, click a building.</p>
    </footer>

    <div id="toast" class="panel fixed top-4 left-1/2 hidden -translate-x-1/2 px-4 py-2 text-sm text-white"></div>
    <div
      id="drop-overlay"
      class="pointer-events-none fixed inset-0 hidden place-items-center bg-ink/80 text-sm text-white"
    >
      Drop a city.json to open it
    </div>
  </body>
</html>
